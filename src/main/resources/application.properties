# Server
server.port=8080

# AI Provider configuration
# The key is read from the AI_API_KEY environment variable.
# Leaving it blank does NOT crash the app - it just means analysis
# requests will return a clear "AI not configured" error until you set it.
ai.api.key=${AI_API_KEY:}
ai.api.provider=gemini
ai.api.model=gemini-1.5-flash
ai.api.timeout-seconds=30

# If true, and the AI key is missing/AI call fails, the app falls back
# to a deterministic "Demo analysis mode" instead of failing the request.
# Set to false if you want hard failures when AI is unavailable.
ai.demo-fallback-enabled=true

# Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Don't log full stack traces to the client
server.error.include-message=always
server.error.include-stacktrace=never

logging.level.com.example.resumeanalyzer=INFO
